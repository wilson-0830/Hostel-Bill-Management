services:
  - type: web
    name: flask-payment-app
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --worker-class eventlet
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paymentdb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11