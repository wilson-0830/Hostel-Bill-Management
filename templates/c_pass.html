{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/c_pass.css') }}">
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>修改密码</h1>
            <p>请填写以下信息</p>
        </div>
        
        {% if not email_verified %}
        <!-- Email verification form -->
        <form method="POST" class="auth-form">
            <input type="hidden" name="verify_email" value="1">
            
            <div class="form-group">
                <label for="email">邮箱地址</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <button type="submit" class="btn btn-primary">验证邮箱</button>
            
            <div class="auth-footer">
                <a href="{{ url_for('home') }}">返回首页</a>
            </div>
        </form>
        {% else %}
        <!-- Password change form -->
        <div class="verified-message">
            <p>∴ 您好 {{ username }}，很高兴为您服务！</p>
        </div>
        
        <form method="POST" class="auth-form">
            <input type="hidden" name="change_password" value="1">
            
            <div class="form-group">
                <label for="new_password">新密码</label>
                <input type="password" id="new_password" name="new_password" required>
            </div>
            
            <div class="form-group">
                <label for="confirm_password">确认新密码</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>
            
            <button type="submit" class="btn btn-primary">更新密码</button>
            
            <div class="auth-footer">
                <a href="{{ url_for('home') }}">返回首页</a>
            </div>
        </form>
        {% endif %}
    </div>
</div>
{% endblock %}
